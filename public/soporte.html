<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeonTap – Ventas Rápidas</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#111827;
      --neon:#22d3ee;
      --neon2:#a78bfa;
      --ok:#22c55e;
      --warn:#eab308;
      --danger:#ef4444;
      --btn:#1f2937;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --shadow: 0 0 18px rgba(34,211,238,.35);
    }
    *{box-sizing:border-box;font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif}
    body{margin:0;background:radial-gradient(1200px 600px at 50% -10%, #0f172a, var(--bg));color:var(--text)}
    .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:10px;padding:10px}
    .total{
      background:linear-gradient(180deg,#0b1220,#0b1220);
      border:1px solid rgba(34,211,238,.35);
      box-shadow:var(--shadow);
      border-radius:14px;
      padding:14px;
      text-align:right
    }
    .total .label{color:var(--muted);font-size:12px}
    .total .value{font-size:36px;font-weight:800;letter-spacing:.5px}

    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }
    .prod{
      user-select:none;
      -webkit-user-select:none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      cursor:pointer;
      position:relative;background:var(--btn);border:1px solid rgba(167,139,250,.25);
      border-radius:14px;padding:10px;min-height:70px;box-shadow:0 6px 20px rgba(0,0,0,.25);
      display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px
    }
    .prod:active{transform:scale(.98)}
    .prod .name{font-size:13px;text-align:center}
    .prod .price{font-size:14px;color:var(--neon)}
    .qty{
      position:absolute;top:6px;right:6px;background:#020617;border:1px solid rgba(34,211,238,.45);
      color:#e5e7eb;border-radius:999px;padding:2px 8px;font-size:12px
    }

    .actions{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      margin-top:6px
    }
    .btn{
      user-select:none;
      -webkit-user-select:none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      cursor:pointer;
border-radius:14px;padding:14px;text-align:center;font-weight:700}
    .btn.ok{background:linear-gradient(180deg,#16a34a,#22c55e);color:#052e16}
    .btn.warn{background:linear-gradient(180deg,#facc15,#eab308);color:#3f2d0b}
    .btn.danger{background:linear-gradient(180deg,#f87171,#ef4444);color:#3b0a0a}
    .btn.secondary{background:#020617;border:1px solid rgba(167,139,250,.35)}

    .pay{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:6px
    }
    .field{background:#020617;border:1px solid rgba(34,211,238,.35);border-radius:14px;padding:10px}
    .field .label{font-size:12px;color:var(--muted)}
    .field .value{font-size:22px;font-weight:800}

    .footer{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-top:6px
    }

    dialog{border:none;border-radius:16px;background:#020617;color:var(--text);padding:16px}
    dialog::backdrop{background:rgba(0,0,0,.55)}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end}
    .knum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
    .knum button{padding:12px;border-radius:12px;background:#111827;color:#e5e7eb;border:1px solid #1f2937}
  </style>
</head>
<body>
  <div class="app">
    <div class="total">
      <div class="label">TOTAL</div>
      <div id="total" class="value">$0.00</div>
    </div>

    <div id="grid" class="grid"></div>

    <div class="actions">
      <div id="btnReset" class="btn danger">RESET</div>
      <div id="btnUndo" class="btn ok">COBRAR</div>
      <div class="btn secondary">&nbsp;</div>
      <div class="btn secondary">&nbsp;</div>
    </div>

    <div class="pay">
      <div class="field">
        <div class="label">PAGO</div>
        <div id="pago" class="value">$0.00</div>
      </div>
      <div class="field">
        <div class="label">CAMBIO</div>
        <div id="cambio" class="value">$0.00</div>
      </div>
    </div>

    <div class="footer">
      <div id="btnDay" class="btn secondary">ACUMULADO DEL DÍA</div>
      <div id="status" style="text-align:center;color:#9ca3af;font-size:12px">Cargando…</div>
    </div>
  </div>

  <dialog id="dlgEdit">
    <h3>Editar producto</h3>
    <label>Nombre</label><br>
    <input id="eName" /><br><br>
    <label>Precio</label><br>
    <input id="ePrice" type="number" step="0.01" /><br><br>
    <div class="modal-actions">
      <button id="eCancel">Cancelar</button>
      <button id="eSave">Guardar</button>
    </div>
  </dialog>

  <dialog id="dlgConfirm">
    <p id="confirmText">¿Seguro?</p>
    <div class="modal-actions">
      <button id="cNo">No</button>
      <button id="cYes">Sí</button>
    </div>
  </dialog>

<dialog id="dlgQty">
  <h3>Editar cantidad</h3>
  <p style="margin:6px 0 10px;color:#9ca3af">Ingresa la cantidad para este producto.</p>
  <input id="qValue" type="number" inputmode="numeric" min="0" step="1"
         style="width:100%;padding:10px;border-radius:12px;border:1px solid #1f2937;background:#111827;color:#e5e7eb;font-size:18px" />
  <div class="modal-actions" style="margin-top:12px">
    <button id="qCancel">Cancelar</button>
    <button id="qSave">Guardar</button>
  </div>
</dialog>

<script>
    // ===== Estado =====
    const state = {
      products: Array.from({length:20}, (_,i)=>({id:i,name:`Producto ${i+1}`,price:0,qty:0})),
      history: [],
      total: 0,
      pago: 0,
      dayTotal: 0
    };

    const fmt = v => `$${v.toFixed(2)}`;

    // ===== UI refs =====
    const grid = document.getElementById('grid');
    const totalEl = document.getElementById('total');
    const pagoEl = document.getElementById('pago');
    const cambioEl = document.getElementById('cambio');
    const btnUndo = document.getElementById('btnUndo');
    const btnReset = document.getElementById('btnReset');

    // ===== Render =====
    function render(){
      grid.innerHTML='';
      state.products.forEach(p=>{
        const b=document.createElement('div');b.className='prod';
        b.innerHTML=`<div class=\"qty\">${p.qty}</div><div class=\"name\">${p.name}</div><div class=\"price\">${fmt(p.price)}</div>`;
        const qtyEl = b.querySelector('.qty');
        qtyEl.addEventListener('pointerup', (e) => {
          e.stopPropagation();
          openQty(p);
        });
        qtyEl.addEventListener('click', (e) => {
          e.stopPropagation();
          openQty(p);
        });
        qtyEl.addEventListener('contextmenu', (e) => e.preventDefault());

        // Triple-tap para editar (evita el menú de selección del sistema)
        let tapCount = 0;
        let tapTimer = null;
        const TAP_WINDOW_MS = 450;

        const registerTap = () => {
          tapCount++;
          if (tapTimer) clearTimeout(tapTimer);
          tapTimer = setTimeout(() => {
            if (tapCount >= 3) {
              openEdit(p);
            } else {
              // 1 o 2 toques = agregar (mantiene rapidez)
              for (let k = 0; k < tapCount; k++) add(p);
            }
            tapCount = 0;
          }, TAP_WINDOW_MS);
        };

        b.addEventListener('click', registerTap);
        b.addEventListener('contextmenu', (e) => e.preventDefault());
        grid.appendChild(b);
      });
      totalEl.textContent = fmt(state.total);
      pagoEl.textContent = fmt(state.pago);
      cambioEl.textContent = fmt(Math.max(0, state.pago - state.total));
    }

    function add(p){
      p.qty++; state.total += p.price; state.history.push({p,delta:1}); render();
    }

    // ===== Edit qty (tap en el numerito) =====
const dlgQty = document.getElementById('dlgQty');
const qValue = document.getElementById('qValue');
let editingQty = null;

function openQty(p){
  editingQty = p;
  qValue.value = p.qty;
  dlgQty.showModal();
  qValue.focus();
  qValue.select?.();
}

function recomputeTotal(){
  state.total = state.products.reduce((sum, x) => sum + (x.qty * x.price), 0);
  // Al editar cantidad manualmente, limpiamos historial para no romper UNDO
  state.history = [];
}

document.getElementById('qCancel').onclick = () => dlgQty.close();
document.getElementById('qSave').onclick = () => {
  const newQty = Math.max(0, Math.floor(Number(qValue.value || 0)));
  if(editingQty) editingQty.qty = newQty;
  recomputeTotal();
  dlgQty.close();
  render();
};

// ===== Edit product =====

    const dlgEdit = document.getElementById('dlgEdit');
    const eName = document.getElementById('eName');
    const ePrice = document.getElementById('ePrice');
    let editing=null;
    function openEdit(p){ editing=p; eName.value=p.name; ePrice.value=p.price; dlgEdit.showModal(); }
    document.getElementById('eCancel').onclick=()=>dlgEdit.close();
    document.getElementById('eSave').onclick=()=>{ editing.name=eName.value; editing.price=+ePrice.value||0; dlgEdit.close(); render(); };

    // ===== Reset / Undo =====
    const dlgConfirm=document.getElementById('dlgConfirm');
    document.getElementById('cNo').onclick=()=>dlgConfirm.close();
    document.getElementById('cYes').onclick=()=>{ state.products.forEach(p=>p.qty=0); state.total=0; state.history=[]; dlgConfirm.close(); render(); };
    btnReset.onclick=()=>{ document.getElementById('confirmText').textContent='¿Borrar venta actual?'; dlgConfirm.showModal(); };

    let undoMode=false;
    btnUndo.onclick=()=>{
      if(!undoMode){ // cobrar
        state.dayTotal += state.total; state.products.forEach(p=>p.qty=0); state.total=0; state.history=[]; undoMode=true; btnUndo.classList.remove('ok'); btnUndo.classList.add('warn'); btnUndo.textContent='UNDO'; render(); return;
      }
      const last=state.history.pop(); if(last){ last.p.qty=Math.max(0,last.p.qty-1); state.total=Math.max(0,state.total-last.p.price); }
      render();
    };

    const statusEl = document.getElementById('status');
if(statusEl) statusEl.textContent = 'Listo ✓';

// ===== Init =====

    render();
  </script>
</body>
</html>
