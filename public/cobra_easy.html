<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeonTap – Ventas Rápidas</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#111827;
      --neon:#22d3ee;
      --neon2:#a78bfa;
      
      --orange:#fb923c;    /* filas 3–4 */
      --orange-border:#fdba74;
      --purple:#7c3aed;    /* fila 5 (especial) */
      --purple-border:#a78bfa;
--ok:#22c55e;
      --warn:#eab308;
      --danger:#ef4444;
      --btn:#1f2937;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --shadow: 0 0 18px rgba(34,211,238,.35);
    }
    *{box-sizing:border-box;font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif}
    body{margin:0;background:radial-gradient(1200px 600px at 50% -10%, #0f172a, var(--bg));color:var(--text)}
    .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:10px;padding:10px}
    .total{
      background:linear-gradient(180deg,#0b1220,#0b1220);
      border:1px solid rgba(34,211,238,.35);
      box-shadow:var(--shadow);
      border-radius:14px;
      padding:14px;
      text-align:right
    }
    .total .label{color:var(--muted);font-size:12px}
    .total .value{font-size:36px;font-weight:800;letter-spacing:.5px}

    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }
    .prod{
      user-select:none;
      -webkit-user-select:none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      cursor:pointer;
      position:relative;background:var(--btn);border:1px solid rgba(167,139,250,.25);
      border-radius:14px;padding:10px;min-height:70px;box-shadow:0 6px 20px rgba(0,0,0,.25);
      display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px
    }
    .prod:active{transform:scale(.98)}
    .prod .name{font-size:13px;text-align:center}
    .prod .price{font-size:14px;color:var(--neon)}

    /* Producto desactivado (sin texto): se ve apagado y no vende */
    .prod.inactive{
      background:#020617 !important;
      border:1px dashed rgba(167,139,250,.35) !important;
      box-shadow:none !important;
      opacity:.35;
      cursor:pointer;
    }
    .prod.inactive .qty{display:none}


    /* Grupos de color por fila */
    .row-a{
      background:linear-gradient(180deg, rgba(34,211,238,.18), rgba(2,6,23,.9));
      border-color:rgba(34,211,238,.55)
    }
    .row-a .price{color:var(--neon)}

    .row-b{
      background:linear-gradient(180deg, rgba(251,146,60,.22), rgba(2,6,23,.9));
      border-color:var(--orange-border)
    }
    .row-b .price{color:var(--orange)}

    .row-c{
      background:linear-gradient(180deg, rgba(124,58,237,.35), rgba(2,6,23,.9));
      border-color:var(--purple-border);
      box-shadow:none
    }
    .row-c .price{color:var(--neon)}
    .qty{
      position:absolute;top:6px;right:6px;background:#020617;border:1px solid rgba(34,211,238,.45);
      color:#e5e7eb;border-radius:999px;padding:2px 8px;font-size:12px
    }

    .actions{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      margin-top:6px
    }
    .btn{
      user-select:none;
      -webkit-user-select:none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      cursor:pointer;
border-radius:14px;padding:14px;text-align:center;font-weight:700}
    .btn.ok{background:linear-gradient(180deg,#16a34a,#22c55e);color:#052e16}
    .btn.warn{background:linear-gradient(180deg,#facc15,#eab308);color:#3f2d0b}
    .btn.danger{background:linear-gradient(180deg,#f87171,#ef4444);color:#3b0a0a}
    .btn.secondary{background:#020617;border:1px solid rgba(167,139,250,.35)}
    .btn.disabled{opacity:.35;filter:saturate(.6);pointer-events:none}
    .btn.payEditable{cursor:text}
    .value[contenteditable="true"]{outline:none}
    .value[contenteditable="true"]:focus{box-shadow:0 0 0 2px rgba(34,211,238,.25) inset;border-radius:10px}


    .pay{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:6px
    }
    .field{background:#020617;border:1px solid rgba(34,211,238,.35);border-radius:14px;padding:10px}
    .field .label{font-size:12px;color:var(--muted)}
    .field .value{font-size:22px;font-weight:800}

    .footer{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-top:6px
    }

    dialog{border:none;border-radius:16px;background:#020617;color:var(--text);padding:16px}
    dialog::backdrop{background:rgba(0,0,0,.55)}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end}
    .knum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
    .knum button{padding:12px;border-radius:12px;background:#111827;color:#e5e7eb;border:1px solid #1f2937}
  
    .app-footer{
      margin-top:auto;
      padding:10px 6px;
      text-align:center;
      font-size:11px;
      color:var(--muted);
      opacity:.75;
    }
    .app-footer a{
      color:var(--muted);
      text-decoration:none;
    }
    .app-footer a:hover{
      color:var(--neon);
    }

  </style>
</head>
<body>
  <div class="app">
    <div class="total">
      <div class="label">TOTAL</div>
      <div id="total" class="value">$0.00</div>
    </div>

    <div id="grid" class="grid"></div>

    <div class="actions">
      <div id="btnReset" class="btn danger">RESET</div>
      <div id="btnUndo" class="btn warn">UNDO</div>
      <div id="btnFinalizar" class="btn ok disabled">FINALIZAR</div>
      <div id="dayTotalBox" class="btn secondary" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:default">
  <div style="font-size:11px;color:#9ca3af;letter-spacing:.3px">DÍA</div>
  <div id="dayTotalVal" style="font-size:16px;font-weight:900;color:#e5e7eb">$0.00</div>
</div>
    </div>

    <div class="pay">
      <div class="field">
        <div class="label">PAGO</div>
        <div id="pago" class="value payEditable" contenteditable="true" spellcheck="false">$0.00</div>
      </div>
      <div class="field">
        <div class="label">CAMBIO</div>
        <div id="cambio" class="value">$0.00</div>
      </div>
    </div>

    <div class="footer">
      <div id="btnDay" class="btn secondary">ACUMULADO DEL DÍA</div>
      <div id="status" style="text-align:center;color:#9ca3af;font-size:12px">Cargando…</div>
    </div>
  </div>

  <dialog id="dlgEdit">
    <h3>Editar producto</h3>
    <label>Nombre</label><br>
    <input id="eName" /><br><br>
    <label>Precio</label><br>
    <input id="ePrice" type="number" step="0.01" /><br><br>
    <div class="modal-actions">
      <button id="eCancel">Cancelar</button>
      <button id="eSave">Guardar</button>
    </div>
  </dialog>

  <dialog id="dlgConfirm">
    <p id="confirmText">¿Seguro?</p>
    <div class="modal-actions">
      <button id="cNo">No</button>
      <button id="cYes">Sí</button>
    </div>
  </dialog>

<dialog id="dlgQty">
  <h3>Editar cantidad</h3>
  <p style="margin:6px 0 10px;color:#9ca3af">Ingresa la cantidad para este producto.</p>
  <input id="qValue" type="number" inputmode="numeric" min="0" step="1"
         style="width:100%;padding:10px;border-radius:12px;border:1px solid #1f2937;background:#111827;color:#e5e7eb;font-size:18px" />
  <div class="modal-actions" style="margin-top:12px">
    <button id="qCancel">Cancelar</button>
    <button id="qSave">Guardar</button>
  </div>
</dialog>

<dialog id="dlgDay">
  <h3>Reporte del día</h3>
  <div id="daySummary" style="color:#9ca3af;font-size:12px;margin-top:6px"></div>
  <div id="dayList" style="margin-top:10px;max-height:55vh;overflow:auto;border:1px solid #1f2937;border-radius:12px;padding:10px"></div>
  <div class="modal-actions" style="margin-top:12px;gap:8px;flex-wrap:wrap">
    <button id="dClose">Cerrar</button>
    <button id="dPdf">PDF</button>
    <button id="dResetDay" style="background:#111827;color:#e5e7eb;border:1px solid #1f2937;border-radius:10px;padding:10px 12px">Reiniciar día</button>
  </div>
</dialog>

<script>
    // ===== Estado =====
    const state = {
      products: Array.from({length:20}, (_,i)=>({
        id:i,
        name: (i===0 || i===8 || i===16) ? 'Producto' : '',
        price: 0,
        qty: 0
      })),
      history: [],
      total: 0,
      pago: 0,
      dayTotal: 0,
      sales: []
    };

    let isEditingPago = false;

    const fmt = v => `$${v.toFixed(2)}`;

    // Total siempre se calcula desde cantidades x precio (evita desfaces)
    function computeTotal(){
      return state.products.reduce((sum, x) => sum + (Number(x.qty||0) * Number(x.price||0)), 0);
    }

    
    function canFinalize(){
      return state.total > 0 && state.pago >= state.total;
    }

    function updateFinalizeUI(){
      if(!btnFinalizar) return;
      if(canFinalize()) btnFinalizar.classList.remove('disabled');
      else btnFinalizar.classList.add('disabled');
    }

    // ===== Ventas del día (se guardan en el navegador) =====
    const DAY_KEY = 'neontap_day_sales_v1';

    function todayKey(){
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const da = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${da}`;
    }

    function loadDay(){
      try{
        const raw = localStorage.getItem(DAY_KEY);
        if(!raw) return;
        const data = JSON.parse(raw);
        if(data.date !== todayKey()){
          // día nuevo
          return;
        }
        if(Array.isArray(data.sales)) state.sales = data.sales;
        if(typeof data.dayTotal === 'number') state.dayTotal = data.dayTotal;
      }catch(e){
        console.warn('No se pudo cargar ventas del día', e);
      }
    }

    function saveDay(){
      try{
        const data = { date: todayKey(), dayTotal: Number(state.dayTotal||0), sales: state.sales || [] };
        localStorage.setItem(DAY_KEY, JSON.stringify(data));
      }catch(e){
        console.warn('No se pudo guardar ventas del día', e);
      }
    }

    function resetDay(){
      state.sales = [];
      state.dayTotal = 0;
      saveDay();
    }

    // ===== Productos (nombres/precios) persistentes =====
    const PRODUCTS_KEY = 'neontap_products_v1';

    function saveProducts(){
      try{
        const data = state.products.map(p => ({
          name: p.name,
          price: Number(p.price || 0)
        }));
        localStorage.setItem(PRODUCTS_KEY, JSON.stringify(data));
      }catch(e){
        console.warn('No se pudo guardar productos', e);
      }
    }

    function loadProducts(){
      try{
        const raw = localStorage.getItem(PRODUCTS_KEY);
        if(!raw) return;
        const data = JSON.parse(raw);
        if(!Array.isArray(data)) return;
        data.forEach((sp, i) => {
          if(!state.products[i]) return;
          if(typeof sp.name === 'string') state.products[i].name = sp.name;
          if(typeof sp.price === 'number') state.products[i].price = sp.price;
        });
      }catch(e){
        console.warn('No se pudo cargar productos', e);
      }
    }
// ===== UI refs =====
    const grid = document.getElementById('grid');
    const totalEl = document.getElementById('total');
    const pagoEl = document.getElementById('pago');
    const cambioEl = document.getElementById('cambio');
    const btnUndo = document.getElementById('btnUndo');
    const btnReset = document.getElementById('btnReset');
    const btnFinalizar = document.getElementById('btnFinalizar');
    const dayTotalVal = document.getElementById('dayTotalVal');

    // ===== Render =====
    function render(){
      grid.innerHTML='';
      state.products.forEach((p,idx)=>{
        const b=document.createElement('div');
        // asignar grupo de color por fila
        const row = Math.floor(idx / 4); // 0-4
        let rowClass = 'row-a';
        if(row === 2 || row === 3) rowClass = 'row-b';
        if(row === 4) rowClass = 'row-c';
        b.className = 'prod ' + rowClass;
        const isActive = (p.name && String(p.name).trim().length > 0);
        if(!isActive){
          b.classList.add('inactive');
          b.innerHTML = '';
          // Sin texto: no vende; un toque abre edición para configurar
          b.addEventListener('click', () => openEdit(p));
          b.addEventListener('contextmenu', (e) => e.preventDefault());
          grid.appendChild(b);
          return;
        }

        b.innerHTML=`<div class=\"qty\">${p.qty}</div><div class=\"name\">${p.name}</div><div class=\"price\">${fmt(p.price)}</div>`;
        const qtyEl = b.querySelector('.qty');
        qtyEl.addEventListener('pointerup', (e) => {
          e.stopPropagation();
          openQty(p);
        });
        qtyEl.addEventListener('click', (e) => {
          e.stopPropagation();
          openQty(p);
        });
        qtyEl.addEventListener('contextmenu', (e) => e.preventDefault());

        // Triple-tap para editar (evita el menú de selección del sistema)
        let tapCount = 0;
        let tapTimer = null;
        const TAP_WINDOW_MS = 450;

        const registerTap = () => {
          tapCount++;
          if (tapTimer) clearTimeout(tapTimer);
          tapTimer = setTimeout(() => {
            if (tapCount >= 3) {
              openEdit(p);
            } else {
              // 1 o 2 toques = agregar (mantiene rapidez)
              for (let k = 0; k < tapCount; k++) add(p);
            }
            tapCount = 0;
          }, TAP_WINDOW_MS);
        };

        b.addEventListener('click', registerTap);
        b.addEventListener('contextmenu', (e) => e.preventDefault());
        grid.appendChild(b);
});
      state.total = computeTotal();
      totalEl.textContent = fmt(state.total);
      // PAGO editable: si el usuario está escribiendo, no lo pisamos
      if (!isEditingPago) pagoEl.textContent = fmt(state.pago);
      cambioEl.textContent = fmt(Math.max(0, state.pago - state.total));
      if(dayTotalVal) dayTotalVal.textContent = fmt(Number(state.dayTotal||0));
      updateFinalizeUI();
    }

    // ===== PAGO editable =====
    const parseMoney = (txt) => {
      const cleaned = String(txt || '').replace(/[^0-9.,-]/g,'').replace(',', '.');
      const v = Number(cleaned);
      return Number.isFinite(v) ? Math.max(0, v) : 0;
    };

    pagoEl.addEventListener('focus', () => {
      isEditingPago = true;
      // mostrar número "crudo" para editar
      pagoEl.textContent = (Number(state.pago || 0)).toFixed(2);
      // mover cursor al final
      const range = document.createRange();
      range.selectNodeContents(pagoEl);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });

    pagoEl.addEventListener('input', () => {
      state.pago = parseMoney(pagoEl.textContent);
      cambioEl.textContent = fmt(Math.max(0, state.pago - state.total));
      if(dayTotalVal) dayTotalVal.textContent = fmt(Number(state.dayTotal||0));
      updateFinalizeUI();
    });

    pagoEl.addEventListener('blur', () => {
      isEditingPago = false;
      render(); // vuelve a formato $ y refresca
    });


    function add(p){
      p.qty++;
      state.history.push({p,delta:1});
      render();
    }

    // ===== Edit qty (tap en el numerito) =====
const dlgQty = document.getElementById('dlgQty');
const qValue = document.getElementById('qValue');
let editingQty = null;

function openQty(p){
  editingQty = p;
  qValue.value = p.qty;
  dlgQty.showModal();
  qValue.focus();
  qValue.select?.();
}

function recomputeTotal(){
  state.total = computeTotal();
  // Al editar cantidad manualmente, limpiamos historial para no romper UNDO
  state.history = [];
}

document.getElementById('qCancel').onclick = () => dlgQty.close();
document.getElementById('qSave').onclick = () => {
  const newQty = Math.max(0, Math.floor(Number(qValue.value || 0)));
  if(editingQty) editingQty.qty = newQty;
  recomputeTotal();
  dlgQty.close();
  render();
};

// ===== Edit product =====

    const dlgEdit = document.getElementById('dlgEdit');
    const eName = document.getElementById('eName');
    const ePrice = document.getElementById('ePrice');
    let editing=null;
    function openEdit(p){ editing=p; eName.value=p.name; ePrice.value=p.price; dlgEdit.showModal(); }
    document.getElementById('eCancel').onclick=()=>dlgEdit.close();
    document.getElementById('eSave').onclick=()=>{ 
      editing.name = (eName.value || '').trim();
      editing.price = +ePrice.value || 0;
      if(!editing.name){ editing.qty = 0; }
      saveProducts();
      dlgEdit.close();
      render();
    };

    // ===== Reset / Undo =====
    const dlgConfirm=document.getElementById('dlgConfirm');
    let confirmAction = null;
    document.getElementById('cNo').onclick = () => { confirmAction = null; dlgConfirm.close(); };
    document.getElementById('cYes').onclick = () => { const fn = confirmAction; confirmAction = null; dlgConfirm.close(); fn && fn(); };
    function askConfirm(text, action){
      document.getElementById('confirmText').textContent = text;
      confirmAction = action;
      dlgConfirm.showModal();
    }
    btnReset.onclick = () => {
      askConfirm('¿Borrar venta actual?', () => {
        state.products.forEach(p=>p.qty=0);
        state.total=0;
        state.pago=0;
        state.history=[];
        render();
      });
    };

    // FINALIZAR: solo se activa si PAGO >= TOTAL
    if (btnFinalizar) {
      btnFinalizar.onclick = () => {
        if (!canFinalize()) return;
        const change = Math.max(0, state.pago - state.total);
        askConfirm(`¿Finalizar venta?\nCambio: ${fmt(change)}`, () => {
          // Registrar venta
          const items = state.products
            .filter(p => Number(p.qty||0) > 0)
            .map(p => ({
              id: p.id,
              name: p.name,
              qty: Number(p.qty||0),
              price: Number(p.price||0),
              line: Number(p.qty||0) * Number(p.price||0)
            }));
          const sale = {
            ts: Date.now(),
            total: Number(state.total||0),
            pago: Number(state.pago||0),
            cambio: Number(change||0),
            items
          };
          state.sales = state.sales || [];
          state.sales.push(sale);

          state.dayTotal += state.total;
          saveDay();

          state.products.forEach(p=>p.qty=0);
          state.total=0;
          state.pago=0;
          state.history=[];
          render();
        });
      };
    }

    // UNDO (amarillo): deshacer 1 acción a la vez
btnUndo.onclick = () => {
  const last = state.history.pop();
  if (!last) return;
  last.p.qty = Math.max(0, last.p.qty - 1);
  render();
};

    const statusEl = document.getElementById('status');
if(statusEl) statusEl.textContent = 'Listo ✓';

// ===== Reporte del día (ACUMULADO DEL DÍA) =====
const btnDay = document.getElementById('btnDay');
const dlgDay = document.getElementById('dlgDay');
const daySummary = document.getElementById('daySummary');
const dayList = document.getElementById('dayList');

function money(v){ return fmt(Number(v||0)); }
function formatTime(ts){
  try{
    const d = new Date(ts);
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }catch{ return ''; }
}

function buildReportHTML(){
  const sales = state.sales || [];
  const rows = sales.map((s, idx) => {
    const items = (s.items||[]).map(it => `
      <tr>
        <td style="padding:4px 0">${it.qty} x ${it.name}</td>
        <td style="padding:4px 0;text-align:right">${money(it.line)}</td>
      </tr>
    `).join('');
    return `
      <div style="margin:14px 0 10px">
        <div style="display:flex;justify-content:space-between;font-weight:700">
          <div>#${idx+1} • ${formatTime(s.ts)}</div>
          <div>${money(s.total)}</div>
        </div>
        <div style="color:#555;font-size:12px;margin-top:4px">Pago: ${money(s.pago)} • Cambio: ${money(s.cambio)}</div>
        <table style="width:100%;margin-top:8px;border-collapse:collapse">${items}</table>
        <div style="border-top:1px dashed #aaa;margin-top:10px"></div>
      </div>
    `;
  }).join('');

  return `
  <div style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <h2 style="margin:0 0 6px">Reporte del día</h2>
    <div style="font-size:12px;color:#333;margin-bottom:10px">Fecha: ${todayKey()}</div>
    <div style="font-size:13px;margin-bottom:12px">Ventas: <b>${sales.length}</b> • Total vendido: <b>${money(state.dayTotal)}</b></div>
    ${sales.length ? rows : '<div style="color:#555">Aún no hay ventas finalizadas hoy.</div>'}
  </div>`;
}

function openDayReport(){
  const sales = state.sales || [];
  daySummary.textContent = `Ventas: ${sales.length}  •  Total vendido: ${money(state.dayTotal)}`;
  if(!sales.length){
    dayList.innerHTML = '<div style="color:#9ca3af">Aún no hay ventas finalizadas hoy.</div>';
  }else{
    dayList.innerHTML = sales.map((s, idx) => {
      const items = (s.items||[]).map(it => `
        <div style="display:flex;justify-content:space-between;gap:10px;color:#e5e7eb;font-size:12px;margin:2px 0">
          <div>${it.qty} x ${it.name}</div>
          <div>${money(it.line)}</div>
        </div>
      `).join('');
      return `
        <div style="padding:10px;border:1px solid #1f2937;border-radius:12px;margin-bottom:10px;background:#0b1220">
          <div style="display:flex;justify-content:space-between;gap:10px">
            <div style="font-weight:800">#${idx+1} • ${formatTime(s.ts)}</div>
            <div style="font-weight:800">${money(s.total)}</div>
          </div>
          <div style="color:#9ca3af;font-size:12px;margin-top:4px">Pago: ${money(s.pago)} • Cambio: ${money(s.cambio)}</div>
          <div style="margin-top:8px">${items}</div>
        </div>
      `;
    }).join('');
  }
  dlgDay.showModal();
}

if(btnDay){
  btnDay.onclick = () => openDayReport();
}

document.getElementById('dClose').onclick = () => dlgDay.close();
