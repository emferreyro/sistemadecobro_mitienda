<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Tienda | Video</title>
<style>
  body{
    margin:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
  }
  video{
    width:100%;
    max-width:900px;
    max-height:90vh;
  }
  .close{
    position:fixed;
    top:10px;
    right:10px;
    background:#f5e131;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
  }
</style>
</head>
<body>

<button class="close" onclick="closeWin()">✖ Cerrar</button>

<video controls autoplay>
  <source src="Mitienda.mp4" type="video/mp4">
  Tu navegador no soporta video.
</video>

<script>
function closeWin(){
  // Si esta ventana se abrió con window.open, el navegador permite cerrarla
  if (window.opener) {
    window.close();
    return;
  }
  // Fallback si fue abierta manualmente
  if (history.length > 1) {
    history.back();
  } else {
    window.location.href = 'sistemadecobro_mitienda.html';
  }
}
</script>

</body>
</html>
